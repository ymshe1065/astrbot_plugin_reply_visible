name: astrbot_plugin_reply_visible
display_name: 插件回复可见
short_desc: 让 AI 看见群内插件/指令的回复，支持本地 OCR/视觉图片识别与防学习标注。
desc: |
  让 AstrBot 的 AI 看见群内插件/指令的回复，包括纯文本、图片卡片和文本转图片卡片。

  插件捕获非 LLM 的指令结果，在下一次 AI 请求前作为临时上下文注入；支持按群隔离、去重、
  限额和防学习标注。注入内容不会写入会话历史。

  ## 图片识别

  识别顺序：本地 OCR -> 视觉模型 -> 占位符。

  - 本地 OCR（可选）：在 AstrBot 所在机器识别图片中的文字，不上传图片、无 API 费用，
    适合数字、文字和表格型卡片；只会读取文字，不理解图标、角色和布局，需要额外磁盘和 CPU。
  - 视觉模型：能理解整张图片的内容和语义；需要配置支持图片的模型，图片会上传，
    可能产生 API 费用，数字识别精度取决于模型。

  ## 安装本地 OCR

  在 AstrBot 使用的 Python 环境执行：

  pip install "rapidocr_onnxruntime>=1.3.0"

  安装后重启 AstrBot。不安装不影响使用，插件会自动回退到视觉模型。
